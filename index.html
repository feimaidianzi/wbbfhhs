          var fallbackDesc=isEn?'CANI Technology - Professional drone accessories manufacturer. Learn more about '+last+'.':'长凌科技 - 专业无人机核心配件制造商。了解更多关于'+last+'的信息。';
          seo=[fallbackTitle,fallbackDesc,pages['/'][2]];
        }else{seo=pages['/'];}
      }
      // Update tags
      var siteName=isEn?'CANI Technology':'CANI 长凌科技';
      var fullTitle=seo[0]+(seo[0].indexOf(siteName)<0?' | '+siteName:'');
      document.title=fullTitle;
      var fullUrl=B+(lang==='zh'?pagePath:'/'+lang+pagePath);
      // Helper to set meta content
      function setM(sel,val){var e=document.querySelector(sel);if(e)e.setAttribute('content',val);}
      setM('meta[name="description"]',seo[1]);
      setM('meta[name="keywords"]',seo[2]);
      setM('meta[name="author"]',isEn?'CANI Technology Co., Ltd.':'长凌科技有限公司');
      // Canonical
      var can=document.querySelector('link[rel="canonical"]');if(can)can.href=fullUrl;
      // OG
      setM('meta[property="og:title"]',fullTitle);
      setM('meta[property="og:description"]',seo[1]);
      setM('meta[property="og:url"]',fullUrl);
      setM('meta[property="og:locale"]',isEn?'en_US':'zh_CN');
      setM('meta[property="og:site_name"]',siteName);
      // Twitter
      setM('meta[name="twitter:title"]',fullTitle);
      setM('meta[name="twitter:description"]',seo[1]);
      // HTML lang
      document.documentElement.lang=lang==='zh'?'zh-CN':lang;
      // Hreflang - update to point to current page path
      var hreflangs=document.querySelectorAll('link[hreflang]');
      for(var j=0;j<hreflangs.length;j++){
        var hl=hreflangs[j].getAttribute('hreflang');
        if(hl==='x-default'){hreflangs[j].href=B+'/en'+pagePath;}
        else if(hl==='zh-CN'){hreflangs[j].href=B+pagePath;}
        else{hreflangs[j].href=B+'/'+hl+pagePath;}
      }
    })();
    </script>
